name: 📊 Daily GitHub Report

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Generate Report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python3 .github/scripts/github_daily_report.py

      - name: Commit and Push
        run: |
          git config user.name "Report Bot"
          git config user.email "bot@users.noreply.github.com"
          git add GitHub_Weekly_Report_*.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: daily GitHub report ($(date +%Y-%m-%d))"
            git push
          fi
