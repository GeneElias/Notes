name: 📊 Daily GitHub Report

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Generate Report
        id: report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python3 .github/scripts/github_daily_report.py

      - name: Commit and Push
        run: |
          # 和 Python 脚本保持一致的北京时间
          BEIJING_DATE=$(TZ=Asia/Shanghai date +%Y%m%d)
          REPORT_FILE="GitHub_Weekly_Report_${BEIJING_DATE}.md"
          echo "Looking for: $REPORT_FILE"

          git config user.name "Report Bot"
          git config user.email "bot@users.noreply.github.com"

          if [ -f "$REPORT_FILE" ]; then
            git add "$REPORT_FILE"
            if git diff --cached --quiet; then
              echo "No changes - file already committed, skipping push"
            else
              git commit -m "chore: daily GitHub report ($(TZ=Asia/Shanghai date +%Y-%m-%d))"
              git push
              echo "✅ 已推送 $REPORT_FILE"
            fi
          else
            echo "Error: $REPORT_FILE not found"
            ls -la GitHub_Weekly_Report_*.md 2>/dev/null || echo "(no report files in workspace)"
            exit 1
          fi
