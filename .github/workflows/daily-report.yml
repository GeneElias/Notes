name: 📊 Daily GitHub Report

on:
  schedule:
    # 北京时间 09:00 = UTC 01:00
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Generate Report
        id: report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python3 .github/scripts/github_daily_report.py

      - name: Commit and Push
        run: |
          REPORT_FILE="GitHub_Weekly_Report_$(date +%Y%m%d).md"
          git config user.name "Report Bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f "$REPORT_FILE" ]; then
            git add "$REPORT_FILE"
            git commit -m "chore: daily GitHub report ($(date +%Y-%m-%d))"
            git push
            echo "✅ 已新增 $REPORT_FILE"
          else
            echo "报告文件未生成，跳过提交"
            exit 1
          fi
